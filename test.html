<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель тестирования мобильных экранов</title>
    <style>
        body { margin: 0; background: #e0e0e0; font-family: sans-serif; text-align: center; }
        .header { background: #333; color: white; padding: 10px; font-size: 18px; }
        .frames-container { display: flex; gap: 20px; padding: 20px; overflow-x: auto; align-items: flex-start; justify-content: center; }
        .frame-box { background: white; border: 4px solid #333; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .frame-title { background: #333; color: white; padding: 5px; font-size: 12px; margin: 0; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="header">
        Синхронный тест экранов для сайта ilimatennis.com
    </div>

    <div class="frames-container">
        <!-- Маленький мобильный телефон -->
        <div class="frame-box" style="width: 320px; height: 568px;">
            <p class="frame-title">Мобильный (320px)</p>
            <iframe src="index.html"></iframe>
        </div>

        <!-- Средний смартфон -->
        <div class="frame-box" style="width: 375px; height: 667px;">
            <p class="frame-title">Смартфон (375px)</p>
            <iframe src="index.html"></iframe>
        </div>

        <!-- Большой смартфон -->
        <div class="frame-box" style="width: 414px; height: 736px;">
            <p class="frame-title">Большой телефон (414px)</p>
            <iframe src="index.html"></iframe>
        </div>

        <!-- Планшет -->
        <div class="frame-box" style="width: 768px; height: 1024px;">
            <p class="frame-title">Планшет (768px)</p>
            <iframe src="index.html"></iframe>
        </div>
    </div>

</body>
</html>
